<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../style/style2.css" />
    <title>workshop</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">accueil</a>
        <a href="apropos.html">À propos</a>
        <a href="Contact.html">Contact</a>
      </nav>
    </header>
    <section>
      <h1>Contact</h1>
      <br />
      <form
        action="https://script.google.com/macros/s/AKfycbxFTPteUGHkVyqlwkCQPz1OpENCbhfBE7A6ojG2iOeiTSYoVkAWckZgXmLMCG7VUu7vCw/exec"
        method="post" target="_blank"
      >
        <label for="name">Nom</label>
        <br />
        <input type="text" placeholder="entrez votre nom" id="name" required name="Nom" />
        <br />
        <br />
        <label for="fullname">Prenom</label>
        <br />
        <input
          type="text" name="Prenom"
          placeholder="entrez votre prenom"
          id="fullname"
          required
        />
        <br />
        <br />
        <label for="Email">Email</label>
        <br />
        <input
          type="Email" name="Email"
          placeholder="entrez votre Email"
          id="Email"
          required
        />
        <br />
        <br />
        <label for="password">Mot de passe</label>
        <br />
        <input
          type="password" name="Mot_de_passe"
          placeholder="entrez votre mot de passe"
          id="password"
          required
        />
        <br />
        <br />
        <label for="Age">Age</label>
        <br />
        <input
          type="number" name="Age"
          placeholder="entrez votre Age"
          id="Age"
          required
          min="18"
        />
        <br />
        <br />
        <label for="date">Date de naissance</label>
        <br />
        <input type="date" id="date" required lang="en" name="Date_de_naissance" />
        <br />
        <br />
        <button type="submit">Envoyer</button>
      </form>
    </section>
  </body>
</html>
